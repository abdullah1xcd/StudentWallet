</g>

<!-- MVP line -->
<line x1="70" y1="795" x2="1730" y2="795" class="line"/>
<rect x="730" y="775" width="340" height="42" rx="10" fill="#c0392b"/>
<text x="900" y="803" text-anchor="middle" style="font:700 20px Arial,sans-serif;fill:white">MVP LINE — FIRST RELEASE</text>

<!-- Later row -->
<g>
<rect x="70" y="835" width="1660" height="230" rx="14" class="later"/>
<text x="95" y="875" class="head">After MVP / Future enhancements</text>
<rect x="105" y="905" width="440" height="105" rx="10" class="card"/><text x="130" y="944" class="task">SW-6 · Google Sign-In</text><text x="130" y="975" class="small">3 pts · Should-have · Sprint 4</text>
<rect x="575" y="905" width="440" height="105" rx="10" class="card"/><text x="600" y="944" class="task">SW-19 · Export transactions to CSV</text><text x="600" y="975" class="small">3 pts · Could-have · Sprint 4</text>
<text x="1080" y="944" class="task">Proposed MVP: 39 points</text><text x="1080" y="975" class="small">Deferred scope: 6 points</text>
</g>
<text x="70" y="1125" class="small">Note: proposed release slice based on current Jira priorities and sprint assignments; confirm with the team and Product Owner before final submission.</text>
</svg>