name: Week 5 Python Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "week5/**"
      - ".github/workflows/week5-python-quality.yml"
  push:
    branches: [week5-quality]
    paths:
      - "week5/**"
      - ".github/workflows/week5-python-quality.yml"

permissions:
  contents: read

jobs:
  python-quality:
    name: Week 5 tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff and Pylint
        run: python -m pip install --upgrade pip ruff pylint

      - name: Run Week 5 unit tests
        run: python -m unittest discover -s week5 -v

      - name: Run Ruff
        run: ruff check week5

      - name: Run Pylint
        run: pylint week5/fees.py week5/test_fees.py week5/grades.py week5/test_grades.py
